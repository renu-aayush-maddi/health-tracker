# Render Blueprint: https://render.com/docs/blueprint-spec
# Two services from one repo. The static site proxies /api/* to the API so the browser sees a
# single origin (first-party SameSite=Lax session cookie, no CORS). See docs/ARCHITECTURE.md §A.
# Pick the region closest to your Supabase project's region.
services:
  - type: web
    name: health-tracker-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    # Free plan has no pre-deploy hook, so migrations run before the server starts.
    startCommand: npm run migrate -w backend && npm start -w backend
    healthCheckPath: /api/health
    buildFilter:
      paths: [backend/**, shared/**, database/**, package.json, package-lock.json]
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL # Supabase session pooler URL
        sync: false
      - key: DATABASE_SSL_CA # Supabase CA certificate (PEM)
        sync: false
      - key: APP_ORIGIN # e.g. https://health-tracker.onrender.com
        sync: false
      - key: TRUST_PROXY
        value: '1'
      - key: MAIL_PROVIDER
        value: smtp
      - key: MAIL_FROM
        sync: false
      - key: SMTP_URL
        sync: false
      - key: CLOUDINARY_URL # cloudinary://key:secret@cloud (optional; enables file uploads)
        sync: false
      - key: CLOUDINARY_FOLDER
        value: health-tracker

  - type: web
    name: health-tracker
    runtime: static
    buildCommand: npm ci && npm run build -w frontend
    staticPublishPath: frontend/dist
    buildFilter:
      paths: [frontend/**, shared/**, package.json, package-lock.json]
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: VITE_API_BASE_URL
        value: /api
    routes:
      # Order matters: API proxy first, then the SPA fallback.
      - type: rewrite
        source: /api/*
        destination: https://health-tracker-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
